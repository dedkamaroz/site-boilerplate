name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (validates config, then builds dist/)
        run: npm run build

      - name: Disguise fingerprint check (warn-only)
        run: npm run fingerprint
